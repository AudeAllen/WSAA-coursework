{% extends "base.html" %}

{% block title %}Add Patient - ED System{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h2>➕ Register New Patient</h2>
        <p style="margin: 0; color: #666; font-size: 0.95rem;">Please enter the patient's information below</p>
    </div>

    <form id="patientForm">
        <div class="form-group">
            <label for="first_name">First Name *</label>
            <input type="text" id="first_name" placeholder="Enter first name" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name *</label>
            <input type="text" id="last_name" placeholder="Enter last name" required>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label for="address">Address *</label>
            <input type="text" id="address" placeholder="Enter full address" required>
        </div>

        <button type="submit" class="btn btn-submit">Register Patient</button>
    </form>

    <a href="/patients" class="btn btn-back" style="margin-top: 1rem; text-align: center; display: block;">← Back to Patients</a>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("patientForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value
    };

    const validation = validateForm(formData);
    if (!validation.valid) {
        showAlert(validation.message, 'error');
        return;
    }

    const submitBtn = document.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    disableButton(submitBtn);

    fetch("/api/patients", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(formData)
    })
    .then(res => {
        if (!res.ok) throw new Error('Failed to add patient');
        return res.json();
    })
    .then(data => {
        showAlert('✓ Patient registered successfully!', 'success');
        document.getElementById("patientForm").reset();
        setTimeout(() => {
            window.location.href = "/patients";
        }, 1500);
    })
    .catch(error => {
        showAlert('❌ Error registering patient. Please try again.', 'error');
        enableButton(submitBtn, originalText);
        console.error('Error:', error);
    });
});
</script>
{% endblock %}
