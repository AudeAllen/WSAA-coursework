<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        button {
            margin: 4px 0;
            padding: 6px 10px;
            cursor: pointer;
        }
        .form-row {
            margin: 10px 0;
        }
        #createUpdateForm {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #999;
            max-width: 500px;
            display: none;
        }
        input, select {
            padding: 6px;
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <h1>Books</h1>

    <button id="button-showCreate" onclick="showCreate()">Create a Book</button>

    <table id="bookTable">
        <tr>
            <th>id</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>
        <tr id="1">
            <td>1</td>
            <td>Harry Potter does something</td>
            <td>JK Rowling</td>
            <td>12</td>
            <td><button onclick="showUpdate(this)">Update</button></td>
            <td><button onclick="doDelete(this)">Delete</button></td>
        </tr>
    </table>

    <div id="createUpdateForm">
        <h2>
            <span id="createLabel">Create a</span>
            <span id="updateLabel" style="display:none">Update this</span>
            Book
        </h2>

        <div class="form-row">
            <label>id</label><br>
            <input type="text" name="id">
        </div>

        <div class="form-row">
            <label>Title</label><br>
            <input type="text" name="title">
        </div>

        <div class="form-row">
            <label>Author</label><br>
            <input type="text" name="author">
        </div>

        <div class="form-row">
            <label>Price</label><br>
            <input type="number" name="price">
        </div>

        <div class="form-row">
            <label>Status</label><br>
            <select name="status">
                <option value="in stock">in stock</option>
                <option value="out of stock">out of stock</option>
                <option value="out of print">out of print</option>
            </select>
        </div>

        <span><button id="button-doCreate" onclick="doCreate()">Create</button></span>
        <span><button id="button-doUpdate" onclick="doUpdate()" style="display:none">Update</button></span>
    </div>

    <script>
        function showCreate() {
            document.getElementById('button-showCreate').style.display = "none";
            document.getElementById('bookTable').style.display = "none";
            document.getElementById('createUpdateForm').style.display = "block";

            document.getElementById('createLabel').style.display = "inline";
            document.getElementById('updateLabel').style.display = "none";
            document.getElementById('button-doCreate').style.display = "inline-block";
            document.getElementById('button-doUpdate').style.display = "none";

            clearForm();
        }

        function showViewAll() {
            document.getElementById('button-showCreate').style.display = "inline-block";
            document.getElementById('bookTable').style.display = "table";
            document.getElementById('createUpdateForm').style.display = "none";
        }

        function showUpdate(buttonElement) {
            document.getElementById('button-showCreate').style.display = "none";
            document.getElementById('bookTable').style.display = "none";
            document.getElementById('createUpdateForm').style.display = "block";

            document.getElementById('createLabel').style.display = "none";
            document.getElementById('updateLabel').style.display = "inline";
            document.getElementById('button-doCreate').style.display = "none";
            document.getElementById('button-doUpdate').style.display = "inline-block";

            var rowElement = buttonElement.parentNode.parentNode;
            var book = getBookFromRow(rowElement);
            populateFormWithBook(book);
        }

        function doCreate() {
            var book = getBookFromForm();
            addBookToTable(book);
            clearForm();
            showViewAll();
        }

        function doUpdate() {
            var book = getBookFromForm();
            var rowElement = document.getElementById(book.id);
            setBookInRow(rowElement, book);
            clearForm();
            showViewAll();
        }

        function doDelete(buttonElement) {
            var tableElement = document.getElementById('bookTable');
            var index = buttonElement.parentNode.parentNode.rowIndex;
            tableElement.deleteRow(index);
        }

        function clearForm() {
            var form = document.getElementById('createUpdateForm');
            form.querySelector('input[name="id"]').disabled = false;
            form.querySelector('input[name="id"]').value = '';
            form.querySelector('input[name="title"]').value = '';
            form.querySelector('input[name="author"]').value = '';
            form.querySelector('input[name="price"]').value = '';
            form.querySelector('select[name="status"]').value = 'in stock';
        }

        function getBookFromForm() {
            var form = document.getElementById('createUpdateForm');
            var book = {};
            book.id = form.querySelector('input[name="id"]').value;
            book.title = form.querySelector('input[name="title"]').value;
            book.author = form.querySelector('input[name="author"]').value;
            book.price = form.querySelector('input[name="price"]').value;
            return book;
        }

        function addBookToTable(book) {
            var tableElement = document.getElementById('bookTable');
            var rowElement = tableElement.insertRow(-1);
            rowElement.setAttribute('id', book.id);

            var cell1 = rowElement.insertCell(0);
            cell1.textContent = book.id;

            var cell2 = rowElement.insertCell(1);
            cell2.textContent = book.title;

            var cell3 = rowElement.insertCell(2);
            cell3.textContent = book.author;

            var cell4 = rowElement.insertCell(3);
            cell4.textContent = book.price;

            var cell5 = rowElement.insertCell(4);
            cell5.innerHTML = '<button onclick="showUpdate(this)">Update</button>';

            var cell6 = rowElement.insertCell(5);
            cell6.innerHTML = '<button onclick="doDelete(this)">Delete</button>';
        }

        function getBookFromRow(rowElement) {
            var book = {};
            book.id = rowElement.cells[0].textContent;
            book.title = rowElement.cells[1].textContent;
            book.author = rowElement.cells[2].textContent;
            book.price = rowElement.cells[3].textContent;
            return book;
        }

        function populateFormWithBook(book) {
            var form = document.getElementById('createUpdateForm');
            form.querySelector('input[name="id"]').disabled = true;
            form.querySelector('input[name="id"]').value = book.id;
            form.querySelector('input[name="title"]').value = book.title;
            form.querySelector('input[name="author"]').value = book.author;
            form.querySelector('input[name="price"]').value = book.price;
        }

        function setBookInRow(rowElement, book) {
            rowElement.cells[0].textContent = book.id;
            rowElement.cells[1].textContent = book.title;
            rowElement.cells[2].textContent = book.author;
            rowElement.cells[3].textContent = book.price;
        }
    </script>

</body>
</html>
